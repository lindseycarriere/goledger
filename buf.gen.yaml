# buf.gen.yaml - Code generation config. Run: buf generate
# See https://buf.build/docs/configuration/v1/buf-gen-yaml
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.2
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative
inputs:
  - directory: proto
