# Compose demo uses host port 50053 so it does not conflict with a user-run server on 50051.
services:
  server:
    build: .
    ports:
      - "50053:50051"
    environment:
      LEDGER_DB_TYPE: ${DB_TYPE:-memory}
      LEDGER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ledger?sslmode=disable
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    depends_on:
      postgres:
        condition: service_healthy
        required: false  # postgres has profile "postgres"; when inactive, server runs with DB_TYPE=memory

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10
    # No ports exposed by default; server connects via service name.
